spring.application.name=HWCreditResponse

spring.kafka.consumer.group-id=CreditResponse
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.bootstrap-servers=host.docker.internal:29092

spring.amqp.deserialization.trust-all=true

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

kafka.topics.credit-request=credit-request

rabbitmq.queues.creditapp=creditapp
